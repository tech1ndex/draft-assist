[build-system]
requires = ["poetry-core>=2.0.0", "wheel"]
build-backend = "poetry.core.masonry.api"

[project]
name = "draft-assist"
version = "0.1.0"
description = "A simple Python tool to assist with Fantasy Sports Drafting."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Victor Bajada" }]
maintainers = [{ name = "Victor Bajada" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Board Games",
]
keywords = ["fantasy", "sports", "draft", "yahoo", "cli"]

[project.urls]
repository = "https://github.com/tech1ndex/draft-assist"

[project.scripts]
draft-assist = "draft_assist.cli.main:app"

[tool.poetry]
name = "draft-assist"
packages = [{ include = "draft_assist", from = "src" }]

[tool.poetry.dependencies]
python = "^3.13"
pydantic = "^2.10.0"
pydantic-settings = "^2.6.0"
requests = "^2.32.0"
loguru = "^0.7.3"
tenacity = "^9.0.0"
typer = {extras = ["all"], version = "^0.15.0"}
black = "^26.1.0"
cryptography = "^46.0.5"

[tool.poetry.group.dev.dependencies]
ruff = "^0.8.0"
mypy = "^1.13.0"
types-requests = "^2.32.0"

[tool.poetry.group.test.dependencies]
pytest = "^8.3.0"
pytest-cov = "^6.0.0"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "A",
    "AIR",
    "ARG",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "C90",
    "COM",
    "CPY",
    "DTZ",
    "E",
    "EM",
    "ERA",
    "EXE",
    "F",
    "FA",
    "FBT",
    "FIX",
    "FLY",
    "FURB",
    "G",
    "I",
    "ICN",
    "INP",
    "INT",
    "ISC",
    "LOG",
    "N",
    "NPY",
    "PD",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "SLOT",
    "T10",
    "T20",
    "TCH",
    "TD",
    "TID",
    "TRIO",
    "TRY",
    "UP",
    "W",
    "YTT",
]
ignore = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D203",
    "D212",
    "PLR0913",
    "COM812",
    "ISC001",
    "G004",     # loguru supports f-strings natively
    "PLE1205",  # false positive: ruff assumes stdlib logging, not loguru
    "TRY401",   # loguru.exception already includes traceback
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "SLF001", "BLE001", "S110", "SIM105", "PLR2004"]

[tool.mypy]
strict = false
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src/draft_assist"]
